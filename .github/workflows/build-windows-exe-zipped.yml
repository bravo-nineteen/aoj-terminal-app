name: Build Windows EXE (Zipped)

on:
  workflow_dispatch:

jobs:
  build-windows-zipped:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Create zipped release package
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $zipPath = "build/windows/x64/runner/aoj-terminal-windows-release.zip"
          if (!(Test-Path $releaseDir)) {
            throw "Release directory not found: $releaseDir"
          }
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath $zipPath -Force

      - name: Upload zipped Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: aoj-terminal-windows-release-zip
          path: build/windows/x64/runner/aoj-terminal-windows-release.zip
          retention-days: 14
